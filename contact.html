<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact &mdash; Benwebdev</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { lime: { 400: '#a3e635', 300: '#bef264' }, dark: { DEFAULT: '#0a0a0a', card: '#141414', border: '#222' } } } }
    }
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Nav -->
  <nav class="fixed top-0 w-full z-50 bg-[#0a0a0a]/90 backdrop-blur-lg border-b border-[#1a1a1a]">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="index.html" class="text-lg font-bold tracking-tight">ben<span class="text-lime-400">webdev</span></a>
      <div class="hidden md:flex items-center gap-8 text-sm text-[#888]">
        <a href="index.html" class="hover:text-white transition-colors">Work</a>
        <a href="about.html" class="hover:text-white transition-colors">About</a>
        <a href="services.html" class="hover:text-white transition-colors">Services</a>
        <a href="portfolio.html" class="hover:text-white transition-colors">Projects</a>
        <a href="contact.html" class="ml-4 text-[#0a0a0a] bg-lime-400 px-5 py-2 rounded-full font-semibold hover:bg-lime-300 transition-colors">Let's Talk</a>
      </div>
      <button id="menu-btn" class="md:hidden text-[#888] hover:text-white" aria-label="Menu">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
    <div id="mobile-menu" class="hidden md:hidden border-t border-[#1a1a1a] bg-[#0a0a0a]">
      <div class="px-6 py-6 flex flex-col gap-4 text-sm">
        <a href="index.html" class="text-[#888]">Work</a>
        <a href="about.html" class="text-[#888]">About</a>
        <a href="services.html" class="text-[#888]">Services</a>
        <a href="portfolio.html" class="text-[#888]">Projects</a>
        <a href="contact.html" class="text-lime-400 font-semibold">Let's Talk</a>
      </div>
    </div>
  </nav>

  <!-- Header -->
  <section class="pt-32 pb-20 px-6">
    <div class="max-w-6xl mx-auto">
      <p class="text-lime-400 text-sm font-medium tracking-widest uppercase mb-4" data-animate>Contact</p>
      <h1 class="text-5xl md:text-7xl font-bold tracking-tight leading-[0.95] max-w-3xl" data-animate>
        Let's build<br>something <span class="text-lime-400">great.</span>
      </h1>
    </div>
  </section>

  <!-- Form + Info -->
  <section class="pb-32 px-6">
    <div class="max-w-6xl mx-auto grid md:grid-cols-2 gap-20">
      <!-- Form -->
      <div data-animate>
        <form id="contact-form" class="space-y-6">
          <div>
            <label for="name" class="block text-sm text-[#888] mb-2">Name</label>
            <input type="text" id="name" name="name" required
              class="w-full bg-[#141414] border border-[#222] rounded-xl px-5 py-3.5 text-white placeholder-[#444] focus:outline-none focus:border-lime-400/50 transition-colors"
              placeholder="Your name">
          </div>
          <div>
            <label for="email" class="block text-sm text-[#888] mb-2">Email</label>
            <input type="email" id="email" name="email" required
              class="w-full bg-[#141414] border border-[#222] rounded-xl px-5 py-3.5 text-white placeholder-[#444] focus:outline-none focus:border-lime-400/50 transition-colors"
              placeholder="you@company.com">
          </div>
          <div>
            <label for="budget" class="block text-sm text-[#888] mb-2">Budget range</label>
            <select id="budget" name="budget"
              class="w-full bg-[#141414] border border-[#222] rounded-xl px-5 py-3.5 text-white focus:outline-none focus:border-lime-400/50 transition-colors">
              <option value="" class="bg-[#141414]">Select a range</option>
              <option value="5k" class="bg-[#141414]">Under $5,000</option>
              <option value="5-10k" class="bg-[#141414]">$5,000 &ndash; $10,000</option>
              <option value="10-25k" class="bg-[#141414]">$10,000 &ndash; $25,000</option>
              <option value="25k+" class="bg-[#141414]">$25,000+</option>
            </select>
          </div>
          <div>
            <label for="message" class="block text-sm text-[#888] mb-2">Tell us about your project</label>
            <textarea id="message" name="message" rows="5" required
              class="w-full bg-[#141414] border border-[#222] rounded-xl px-5 py-3.5 text-white placeholder-[#444] focus:outline-none focus:border-lime-400/50 transition-colors resize-none"
              placeholder="What are you building? What problem are you solving?"></textarea>
          </div>
          <button type="submit" class="btn w-full justify-center text-base">Send message
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>
        </form>
      </div>

      <!-- Info -->
      <div class="space-y-10" data-animate>
        <div>
          <h3 class="text-sm text-[#888] mb-2">Email</h3>
          <a href="mailto:hello@benwebdev.com" class="text-lg hover:text-lime-400 transition-colors">hello@benwebdev.com</a>
        </div>
        <div>
          <h3 class="text-sm text-[#888] mb-2">Response time</h3>
          <p class="text-lg">Within 24 hours, usually faster.</p>
        </div>
        <div>
          <h3 class="text-sm text-[#888] mb-4">Find us online</h3>
          <div class="flex gap-3">
            <a href="#" class="w-11 h-11 bg-[#141414] border border-[#222] rounded-xl flex items-center justify-center text-[#888] hover:text-lime-400 hover:border-lime-400/30 transition-all" aria-label="Twitter">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
            </a>
            <a href="#" class="w-11 h-11 bg-[#141414] border border-[#222] rounded-xl flex items-center justify-center text-[#888] hover:text-lime-400 hover:border-lime-400/30 transition-all" aria-label="GitHub">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/></svg>
            </a>
            <a href="#" class="w-11 h-11 bg-[#141414] border border-[#222] rounded-xl flex items-center justify-center text-[#888] hover:text-lime-400 hover:border-lime-400/30 transition-all" aria-label="LinkedIn">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
            </a>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="border-t border-[#1a1a1a] py-10 px-6">
    <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6 text-sm text-[#666]">
      <span class="font-semibold text-white">ben<span class="text-lime-400">webdev</span></span>
      <div class="flex gap-6">
        <a href="index.html" class="hover:text-white transition-colors">Work</a>
        <a href="about.html" class="hover:text-white transition-colors">About</a>
        <a href="services.html" class="hover:text-white transition-colors">Services</a>
        <a href="contact.html" class="hover:text-white transition-colors">Contact</a>
      </div>
      <span>&copy; 2026</span>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
