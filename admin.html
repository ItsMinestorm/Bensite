<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin &mdash; Benwebdev</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { lime: { 400: '#a3e635', 300: '#bef264' }, dark: { DEFAULT: '#0a0a0a', card: '#141414', border: '#222' } } } }
    }
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Nav -->
  <nav class="fixed top-0 w-full z-50 bg-[#0a0a0a]/90 backdrop-blur-lg border-b border-[#1a1a1a]">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="index.html" class="text-lg font-bold tracking-tight">ben<span class="text-lime-400">webdev</span></a>
      <div class="hidden md:flex items-center gap-8 text-sm text-[#888]">
        <a href="index.html" class="hover:text-white transition-colors">Work</a>
        <a href="about.html" class="hover:text-white transition-colors">About</a>
        <a href="services.html" class="hover:text-white transition-colors">Services</a>
        <a href="portfolio.html" class="hover:text-white transition-colors">Projects</a>
        <a href="contact.html" class="ml-4 text-[#0a0a0a] bg-lime-400 px-5 py-2 rounded-full font-semibold hover:bg-lime-300 transition-colors">Let's Talk</a>
      </div>
      <button id="menu-btn" class="md:hidden text-[#888] hover:text-white" aria-label="Menu">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
    <div id="mobile-menu" class="hidden md:hidden border-t border-[#1a1a1a] bg-[#0a0a0a]">
      <div class="px-6 py-6 flex flex-col gap-4 text-sm">
        <a href="index.html" class="text-[#888]">Work</a>
        <a href="about.html" class="text-[#888]">About</a>
        <a href="services.html" class="text-[#888]">Services</a>
        <a href="portfolio.html" class="text-[#888]">Projects</a>
        <a href="contact.html" class="text-lime-400 font-semibold">Let's Talk</a>
      </div>
    </div>
  </nav>

  <!-- Login Screen -->
  <section id="login-screen" class="pt-32 pb-20 px-6">
    <div class="max-w-sm mx-auto">
      <h1 class="text-3xl font-bold tracking-tight mb-2 text-center">Admin Login</h1>
      <p class="text-[#666] text-sm text-center mb-8">Enter your password to manage projects.</p>
      <form id="login-form" class="space-y-4">
        <input type="password" id="login-password" placeholder="Password" required
          class="w-full bg-[#141414] border border-[#222] rounded-xl px-5 py-3.5 text-white placeholder-[#444] focus:outline-none focus:border-lime-400/50 transition-colors text-sm">
        <button type="submit" class="btn w-full justify-center text-sm">Log in</button>
        <p id="login-error" class="text-red-400 text-sm text-center hidden">Wrong password</p>
      </form>
    </div>
  </section>

  <!-- Admin Dashboard (hidden until logged in) -->
  <section id="dashboard" class="hidden pt-32 pb-10 px-6">
    <div class="max-w-3xl mx-auto">
      <div class="flex items-center justify-between mb-10">
        <div>
          <p class="text-lime-400 text-sm font-medium tracking-widest uppercase mb-2">Admin</p>
          <h1 class="text-3xl md:text-4xl font-bold tracking-tight">Manage Projects</h1>
        </div>
        <button id="logout-btn" class="text-sm text-[#666] hover:text-white transition-colors">Log out</button>
      </div>

      <!-- Add Project Form -->
      <div class="card mb-10">
        <h2 class="text-lg font-semibold mb-5">Add New Project</h2>
        <form id="project-form" class="space-y-4">
          <div class="grid md:grid-cols-2 gap-4">
            <div>
              <label for="title" class="block text-sm text-[#888] mb-1.5">Title *</label>
              <input type="text" id="title" name="title" required
                class="w-full bg-[#0a0a0a] border border-[#222] rounded-xl px-4 py-3 text-white placeholder-[#444] focus:outline-none focus:border-lime-400/50 transition-colors text-sm"
                placeholder="e.g. Wildtrek Overland">
            </div>
            <div>
              <label for="category" class="block text-sm text-[#888] mb-1.5">Category</label>
              <input type="text" id="category" name="category"
                class="w-full bg-[#0a0a0a] border border-[#222] rounded-xl px-4 py-3 text-white placeholder-[#444] focus:outline-none focus:border-lime-400/50 transition-colors text-sm"
                placeholder="e.g. E-Commerce, Landing Page">
            </div>
          </div>
          <div>
            <label for="url" class="block text-sm text-[#888] mb-1.5">Live URL</label>
            <input type="url" id="url" name="url"
              class="w-full bg-[#0a0a0a] border border-[#222] rounded-xl px-4 py-3 text-white placeholder-[#444] focus:outline-none focus:border-lime-400/50 transition-colors text-sm"
              placeholder="https://example.com">
          </div>
          <div>
            <label for="description" class="block text-sm text-[#888] mb-1.5">Description</label>
            <textarea id="description" name="description" rows="3"
              class="w-full bg-[#0a0a0a] border border-[#222] rounded-xl px-4 py-3 text-white placeholder-[#444] focus:outline-none focus:border-lime-400/50 transition-colors text-sm resize-none"
              placeholder="Brief description..."></textarea>
          </div>
          <div class="flex items-center gap-3">
            <input type="checkbox" id="featured" name="featured" class="accent-[#a3e635]">
            <label for="featured" class="text-sm text-[#888]">Featured (shows on homepage)</label>
          </div>
          <button type="submit" class="btn text-sm">Add project
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </form>
      </div>

      <!-- Project List -->
      <h2 class="text-lg font-semibold mb-4">Existing Projects</h2>
      <div id="project-list" class="space-y-3 mb-20">
        <p class="text-[#555] text-sm">Loading...</p>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="border-t border-[#1a1a1a] py-10 px-6">
    <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6 text-sm text-[#666]">
      <span class="font-semibold text-white">ben<span class="text-lime-400">webdev</span></span>
      <div class="flex gap-6">
        <a href="index.html" class="hover:text-white transition-colors">Work</a>
        <a href="about.html" class="hover:text-white transition-colors">About</a>
        <a href="services.html" class="hover:text-white transition-colors">Services</a>
        <a href="contact.html" class="hover:text-white transition-colors">Contact</a>
      </div>
      <span>&copy; 2026</span>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script>
    let token = localStorage.getItem('bw Token');

    async function api(path, opts = {}) {
      const res = await fetch(path, {
        ...opts,
        headers: {
          'Content-Type': 'application/json',
          ...(token ? { Authorization: `Bearer ${token}` } : {}),
          ...opts.headers
        }
      });
      if (res.status === 401) {
        token = null;
        localStorage.removeItem('bw Token');
        showLogin();
        throw new Error('Unauthorized');
      }
      return res.json();
    }

    function showLogin() {
      document.getElementById('login-screen').classList.remove('hidden');
      document.getElementById('dashboard').classList.add('hidden');
    }

    function showDashboard() {
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      loadProjects();
    }

    async function loadProjects() {
      const list = document.getElementById('project-list');
      try {
        const projects = await api('/api/projects');
        if (projects.length === 0) {
          list.innerHTML = '<p class="text-[#555] text-sm">No projects yet.</p>';
          return;
        }
        list.innerHTML = '';
        projects.forEach(p => {
          const item = document.createElement('div');
          item.className = 'card flex items-center justify-between gap-4';
          item.innerHTML = `
            <div class="min-w-0">
              <div class="flex items-center gap-2">
                <h3 class="font-semibold truncate">${p.title}</h3>
                ${p.featured ? '<span class="text-[10px] bg-lime-400/10 text-lime-400 px-2 py-0.5 rounded-full">Featured</span>' : ''}
              </div>
              <p class="text-[#666] text-sm truncate">${p.category || 'No category'}${p.url ? ' &middot; ' + p.url : ''}</p>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              <button data-edit='${JSON.stringify(p).replace(/'/g, "&#39;")}' class="text-[#555] hover:text-lime-400 transition-colors p-2" aria-label="Edit">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
              </button>
              <button data-delete="${p.id}" class="text-[#555] hover:text-red-400 transition-colors p-2" aria-label="Delete">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
              </button>
            </div>
          `;
          list.appendChild(item);
        });

        list.querySelectorAll('[data-delete]').forEach(btn => {
          btn.addEventListener('click', async () => {
            if (!confirm('Delete this project?')) return;
            await api(`/api/projects/${btn.dataset.delete}`, { method: 'DELETE' });
            loadProjects();
          });
        });

        list.querySelectorAll('[data-edit]').forEach(btn => {
          btn.addEventListener('click', () => {
            const p = JSON.parse(btn.dataset.edit);
            const form = document.getElementById('project-form');
            form.title.value = p.title;
            form.category.value = p.category;
            form.url.value = p.url;
            form.description.value = p.description;
            form.featured.checked = !!p.featured;
            form.dataset.editId = p.id;
            form.querySelector('button[type="submit"]').textContent = 'Update project';
            form.scrollIntoView({ behavior: 'smooth' });
          });
        });
      } catch (e) {
        list.innerHTML = '<p class="text-red-400 text-sm">Failed to load projects.</p>';
      }
    }

    // Login
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw = document.getElementById('login-password').value;
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pw })
        });
        const data = await res.json();
        if (res.ok && data.token) {
          token = data.token;
          localStorage.setItem('bw Token', token);
          document.getElementById('login-error').classList.add('hidden');
          showDashboard();
        } else {
          document.getElementById('login-error').classList.remove('hidden');
        }
      } catch {
        document.getElementById('login-error').classList.remove('hidden');
      }
    });

    // Logout
    document.getElementById('logout-btn').addEventListener('click', () => {
      token = null;
      localStorage.removeItem('bw Token');
      showLogin();
    });

    // Add/Update project
    document.getElementById('project-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const body = {
        title: form.title.value.trim(),
        category: form.category.value.trim(),
        url: form.url.value.trim(),
        description: form.description.value.trim(),
        featured: form.featured.checked
      };
      if (!body.title) return;

      const editId = form.dataset.editId;
      if (editId) {
        await api(`/api/projects/${editId}`, { method: 'PUT', body: JSON.stringify(body) });
        delete form.dataset.editId;
        form.querySelector('button[type="submit"]').textContent = 'Add project';
      } else {
        await api('/api/projects', { method: 'POST', body: JSON.stringify(body) });
      }
      form.reset();
      loadProjects();
    });

    // Check if already logged in
    if (token) {
      showDashboard();
    } else {
      showLogin();
    }
  </script>
</body>
</html>
